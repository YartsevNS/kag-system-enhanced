# Отладочный compose: контейнер постоянный, код монтируется с диска.
#
# DEV-режим — запускать ЯВНО, автоматически НЕ подхватывается
# (имя намеренно не docker-compose.override.yml).
#
#   Прод (образ, код зашит):
#     docker compose up -d
#
#   Отладка (образ остаётся постоянным, код монтируется с диска):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api worker
#
#     правка HTML/JS/CSS  — видна сразу, ничего делать не нужно (страницы с no-store)
#     правка Python-кода  — docker restart kag-api (2–3 секунды вместо сборки на 2–5 минут)
#
# Путь к коду задаётся KAG_SRC, потому что на сервере 192.168.50.18 каталог данных
# и каталог кода разные:
#     cd /home/yartsevn/kag-system
#     KAG_SRC=/home/yartsevn/kag-live/src \
#     docker-compose -f docker-compose.yml -f /home/yartsevn/kag-live/docker-compose.dev.yml \
#       up -d api worker worker-maintenance
#
# Сборка нужна только при изменении requirements.txt / Dockerfile / весов моделей.

services:
  api:
    volumes:
      - ${KAG_SRC:-./src}:/app/src

  worker:
    volumes:
      - ${KAG_SRC:-./src}:/app/src

  worker-maintenance:
    volumes:
      - ${KAG_SRC:-./src}:/app/src
