# DEV-композ — запускать ЯВНО, он НЕ подхватывается автоматически
# (имя не docker-compose.override.yml!).
#
#   Локальная разработка (build + живой ./src):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
#   Прод (готовые образы с Docker Hub, код зашит):
#     docker compose up -d          # только docker-compose.yml
#
# Базовый docker-compose.yml использует ГОТОВЫЕ образы kre44et/kag-* (код
# зашит). Этот файл возвращает dev-режим: сборка из локальных Dockerfile'ов
# + монтирование живого ./src — правки кода видны без пересборки образа
# (docker compose restart api).
#
# ВАЖНО: Dockerfile/Dockerfile.worker/Dockerfile.mcp наследуют образ
# kre44et/kag-base:2026.09.07. Для dev-сборки он должен быть доступен
# (собран локально или docker pull kre44et/kag-base:2026.09.07).
# Пересобирать base нужно только при изменении requirements.txt/весов:
#   docker build -t kre44et/kag-base:2026.09.07 -f docker/base/Dockerfile .

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app/src

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - ./src:/app/src

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    volumes:
      - ./src:/app/src
