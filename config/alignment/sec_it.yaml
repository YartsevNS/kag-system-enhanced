# Маппинги выравнивания доменов: мера ИБ (ФСТЭК) ↔ ИТ-контроль (например, NIST/ISO).
#
# Каждая пара создаёт связь alignment(kind, confidence, authored_by) в TypeDB.
# kind: exact | close | related
# confidence: 0..1
# authored_by: кто подтвердил пару — обязательно, без автора связь не пишется.
#
# ВАЖНО: пары ниже — ПРИМЕРЫ ДЛЯ ПРОВЕРКИ МЕХАНИЗМА, не выверенное соответствие.
# Каждая пара должна быть подтверждена специалистом перед использованием.
pairs:
  - source: {type: security_measure, code: "АВЗ.1"}
    target: {type: it_control, code: "AC-2"}
    kind: close
    confidence: 0.8
    authored_by: "пример для проверки механизма"
    note: "антивирусная защита ↔ управление учётными записями — проверить специалисту"
