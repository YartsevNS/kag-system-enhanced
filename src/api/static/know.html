<!DOCTYPE html><html lang="ru"><head>
<script id="kag-theme-boot">/* тема до отрисовки: светлая по умолчанию, выбор пользователя хранится в localStorage */
try{document.documentElement.setAttribute("data-theme",localStorage.getItem("kag-theme")||"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
    <meta charset="UTF-8"><title>KAG — База знаний</title>
    <style>
:root{--bg:#171717;--panel:#0f0f0f;--surface:#1c1c1c;--elevated:#242424;--text:#fafafa;--text2:#b4b4b4;--text3:#898989;--text4:#4d4d4d;--accent:#3ecf8e;--accent-h:#00c573;--accent-l:#6ee7b7;--green:#3ecf8e;--emerald:#10b981;--red:#e5484d;--red2:#dc2626;--amber:#f5a623;--purple:#8b5cf6;--border:#2e2e2e;--border-s:#242424;--border-strong:#363636;--accent-border:rgba(62,207,142,0.3);--radius:8px;--radius-sm:6px;--radius-lg:16px;--radius-pill:9999px;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Cascadia Code','Fira Code','Consolas',monospace;--font-mono:'Cascadia Code','Fira Code','Consolas',monospace;}

        body { font-family: sans-serif; max-width: 600px; margin: 80px auto; padding: 20px; color: #333; }
        a { color: #5e6ad2; }
    
/* Supabase: primary-кнопки — pill (9999px), вес 500 (не 600/700) */
.btn{border-radius:var(--radius-pill)!important;font-weight:500}
</style><style>
/* ==== Сдерживание раскладки (05.10.2026) ====
   Причина: главный flex-элемент (main/.main) без min-width:0 не сжимается, и широкий контент
   (таблицы в ответах, длинные строки и URL, картинки) распирает страницу — появляется
   горизонтальная прокрутка, а боковое меню уезжает за левый край («меню исчезло»).
   Проверено приборно: при 800px широкий ответ давал scrollWidth 1046 при клиентских 800. */
main, .main, .content, .container { min-width: 0; max-width: 100%; }
.content table, main table, .main table { max-width: 100%; }
/* Таблицы внутри ответов и markdown-блоков прокручиваются сами, страницу не растягивают */
.md table, .bubble table, .message table, .chat-table { display: block; overflow-x: auto; max-width: 100%; }
pre, code { max-width: 100%; }
pre { overflow-x: auto; }
img, svg, video, canvas, iframe { max-width: 100%; }
/* Длинные строки без пробелов (URL, идентификаторы) переносятся, а не расширяют страницу */
.md, .bubble, .message, .msg, .card p, .row { overflow-wrap: anywhere; word-break: break-word; }
</style>
