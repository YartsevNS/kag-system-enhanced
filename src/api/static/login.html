<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAG — Вход</title>

<style>
:root{--bg:#171717;--panel:#0f0f0f;--surface:#1c1c1c;--elevated:#242424;--text:#fafafa;--text2:#b4b4b4;--text3:#898989;--text4:#4d4d4d;--accent:#3ecf8e;--accent-h:#00c573;--accent-l:#6ee7b7;--green:#3ecf8e;--emerald:#10b981;--red:#e5484d;--red2:#dc2626;--amber:#f5a623;--purple:#8b5cf6;--border:#2e2e2e;--border-s:#242424;--border-strong:#363636;--accent-border:rgba(62,207,142,0.3);--radius:8px;--radius-sm:6px;--radius-lg:16px;--radius-pill:9999px;--font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Cascadia Code','Fira Code','Consolas',monospace;--font-mono:'Cascadia Code','Fira Code','Consolas',monospace;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui, -apple-system, sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;width:380px;max-width:90vw}
h1{font-size:24px;font-weight:600;text-align:center;margin-bottom:8px}
.sub{font-size:14px;color:var(--text3);text-align:center;margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:13px;color:var(--text3);margin-bottom:6px;font-weight:500}
input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:system-ui, -apple-system, sans-serif;outline:none}
input:focus{border-color:var(--accent-h);box-shadow:0 0 0 2px rgba(94,106,210,0.2)}
.btn{width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s;margin-top:8px}
.btn:hover{opacity:0.85}
.error{background:rgba(220,38,38,0.1);border:1px solid rgba(220,38,38,0.2);border-radius:var(--radius-sm);padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:16px;display:none}
.error.show{display:block}

/* Supabase: primary-кнопки — pill (9999px), вес 500 (не 600/700) */
.btn{border-radius:var(--radius-pill)!important;font-weight:500}
</style>
</head>
<body>
<div class="card">
  <h1> KAG</h1>
  <div class="sub">Войдите в систему · <span id="auth-mode" style="font-size:12px">—</span></div>
  <div class="error" id="error"></div>
  <div class="field">
    <label>Логин</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>
  <div class="field">
    <label>Пароль</label>
    <input type="password" id="password" placeholder="••••••" autocomplete="current-password">
  </div>
  <button class="btn" onclick="login()">Войти</button>
  <div style="text-align:center;margin-top:12px">
    <a href="#" id="local-link" onclick="useLocalLogin();return false" style="font-size:12px;color:var(--accent-l);display:none">🔑 Локальный вход (admin)</a>
  </div>
</div>
<script>
let ssoConfig = null;
let useLocal = false; // переключение на локальный вход (admin fallback)

// Проверяем статус аутентификации: включён ли SSO (Keycloak)
async function initAuth() {
  try {
    const r = await fetch('/api/v1/auth/status');
    const d = await r.json();
    ssoConfig = d;
    updateModeBadge();
  } catch(e) { /* статус не критичен */ }
}

function updateModeBadge() {
  const badge = document.getElementById('auth-mode');
  const localLink = document.getElementById('local-link');
  if (useLocal) {
    badge.textContent = 'Локальный вход (admin)';
    badge.style.color = 'var(--text3)';
    if (localLink) localLink.style.display = 'none';
  } else if (ssoConfig && ssoConfig.sso_enabled) {
    badge.textContent = 'Вход через SSO (Keycloak)';
    badge.style.color = 'var(--accent-l)';
    if (localLink) localLink.style.display = '';
  } else {
    badge.textContent = 'Локальный вход';
    badge.style.color = 'var(--text3)';
    if (localLink) localLink.style.display = 'none';
  }
}

function useLocalLogin() {
  useLocal = true;
  updateModeBadge();
  const err = document.getElementById('error');
  err.classList.remove('show');
}

async function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('error');
  if (!u || !p) { err.textContent = 'Введите логин и пароль'; err.classList.add('show'); return; }
  try {
    let ok = false;

    // Локальный вход (админ-фолбэк) — если включили вручную ИЛИ SSO недоступен
    const tryLocal = async () => {
      const res = await fetch('/api/v1/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:u, password:p})
      });
      const data = await res.json();
      if (res.ok && data.access_token) return true;
      err.textContent = data.detail || 'Неверный логин или пароль';
      err.classList.add('show');
      return false;
    };

    if (useLocal) {
      ok = await tryLocal();
    } else if (ssoConfig && ssoConfig.sso_enabled && ssoConfig.keycloak_url) {
      // SSO: password grant у Keycloak
      try {
        const tokenResp = await fetch(
          `${ssoConfig.keycloak_url}/realms/${ssoConfig.realm}/protocol/openid-connect/token`,
          {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({
              grant_type: 'password',
              client_id: ssoConfig.client_id,
              username: u,
              password: p
            })
          }
        );
        const tokenData = await tokenResp.json();
        if (tokenResp.ok && tokenData.access_token) {
          const ssoResp = await fetch('/api/v1/auth/sso-login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({access_token: tokenData.access_token})
          });
          ok = ssoResp.ok;
          if (!ok) {
            const e = await ssoResp.json().catch(() => ({}));
            err.textContent = e.detail || 'SSO: ошибка входа';
            err.classList.add('show');
            document.getElementById('local-link').style.display = '';
            return;
          }
        } else {
          // Неверные креды в Keycloak — предлагаем локальный вход (admin)
          err.textContent = (tokenData.error_description || tokenData.error || 'SSO: неверный логин или пароль') + '. Попробуйте локальный вход для admin.';
          err.classList.add('show');
          document.getElementById('local-link').style.display = '';
          return;
        }
      } catch (netErr) {
        // Keycloak недоступен — автоматически локальный вход (admin fallback)
        err.textContent = 'SSO недоступен — пробую локальный вход (admin)...';
        err.classList.add('show');
        ok = await tryLocal();
      }
    } else {
      ok = await tryLocal();
    }

    if (ok) {
      // Сервер ставит httpOnly cookie kag_token — нам не нужно сохранять.
      // ВАЖНО (безопасность): чистим localStorage от ТОКЕНА И СЕССИЙ прошлого
      // пользователя (общий компьютер). Новый токен живёт только в cookie.
      localStorage.removeItem('kag_token');
      localStorage.removeItem('kag_sessions');
      localStorage.removeItem('kag_user');
      const redirect = new URLSearchParams(window.location.search).get('next') || '/documents';
      window.location.href = redirect;
    }
  } catch(e) { err.textContent = 'Ошибка сети'; err.classList.add('show'); }
}
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
initAuth();
</script>
</body>
</html>
