<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Покрытие документа — KAG</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg,#0f1115);color:var(--text,#e8eaed)}
  nav{width:240px;background:var(--panel,#151922);border-right:1px solid var(--border-s,#252b36);position:fixed;height:100vh;padding:20px 0;overflow-y:auto;display:flex;flex-direction:column}
  main{margin-left:240px;padding:24px 32px 60px;max-width:1100px}
  h1{font-size:20px;margin:0 0 6px}
  h2{font-size:15px;margin:24px 0 10px}
  .muted{color:var(--text3,#8b93a1);font-size:12px;line-height:1.6}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  select{background:var(--elevated,#1c2230);border:1px solid var(--border,#2c3442);border-radius:6px;color:var(--text,#e8eaed);padding:7px 10px;font-size:13px;min-width:320px;max-width:640px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
  .card{background:var(--panel,#151922);border:1px solid var(--border,#2c3442);border-radius:10px;padding:14px}
  .card .num{font-size:22px;font-weight:600}
  .card .lbl{font-size:12px;color:var(--text3,#8b93a1);margin-top:4px}
  .ok{color:#3ecf8e}.warn{color:#e8c07d}.bad{color:#ff9a9a}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border-s,#252b36)}
  th{color:var(--text3,#8b93a1);font-weight:500;font-size:12px}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>Паспорт покрытия документа</h1>
  <div class="muted">Что извлечено из документа и как связано: узлы по типам, доли связей «требование → пункт»,
    «требование → мера», «мера → пункт», родовые понятия и очередь разбора. Числа — из базы TypeDB,
    по провенансу (source-chunk-id документа).</div>

  <div class="row">
    <span class="muted">документ:</span>
    <select id="docSel"></select>
  </div>
  <div id="report"></div>
</main>
<script src="/static/site-nav.js"></script>
<script>
const API = '/api/v1';
let STATE = {doc: null, docs: []};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a, b) => b > 0 ? Math.round(100 * a / b) + '%' : '—';
const color = (a, b) => b > 0 && a / b >= 0.9 ? 'ok' : b > 0 && a / b >= 0.7 ? 'warn' : '';

function card(num, lbl, cls) {
  return `<div class="card"><div class="num ${cls || ''}">${num}</div><div class="lbl">${lbl}</div></div>`;
}

function render(r) {
  if (!r.ok) { document.getElementById('report').innerHTML = `<div class="bad">${esc(r.error || 'ошибка')}</div>`; return; }
  const req = r.requirements || 0;
  const html = `
    <div class="cards">
      ${card(r.elements, 'пунктов документа')}
      ${card(req, 'требований')}
      ${card(r.measures, 'мер')}
      ${card(pct(r.req_with_clause, req), 'требований с пунктом', color(r.req_with_clause, req))}
      ${card(pct(r.req_with_measure, req), 'требований с мерой', color(r.req_with_measure, req))}
      ${card(pct(r.measure_with_clause, r.measures), 'мер с пунктом', color(r.measure_with_clause, r.measures))}
      ${card(r.queue_pending, 'в очереди разбора')}
    </div>
    ${Object.keys(r.generic || {}).length
      ? `<h2>Родовые понятия</h2><table><thead><tr><th>тип</th><th>сколько</th></tr></thead><tbody>
         ${Object.entries(r.generic).map(([t, n]) => `<tr><td><code>${esc(t)}</code></td><td>${n}</td></tr>`).join('')}
         </tbody></table>`
      : '<div class="muted">Родовых понятий в этом документе нет.</div>'}`;
  document.getElementById('report').innerHTML = html;
}

async function loadDocs() {
  const r = await fetch(API + '/documents?limit=200', {credentials: 'same-origin'});
  const d = await r.json();
  STATE.docs = d.items || d.documents || [];
  const sel = document.getElementById('docSel');
  sel.innerHTML = STATE.docs.map(x =>
    `<option value="${esc(x.document_id || x.id)}">${esc(x.filename || x.name || x.document_id || x.id)}</option>`).join('');
  sel.onchange = () => { history.replaceState(null, '', '?document_id=' + encodeURIComponent(sel.value)); load(); };
  const fromUrl = new URLSearchParams(location.search).get('document_id');
  if (fromUrl && STATE.docs.some(x => (x.document_id || x.id) === fromUrl)) sel.value = fromUrl;
  load();
}

async function load() {
  const doc = document.getElementById('docSel').value;
  if (!doc) return;
  try {
    const r = await fetch(API + '/ontology/coverage?document_id=' + encodeURIComponent(doc),
                          {credentials: 'same-origin', cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    document.getElementById('report').innerHTML = `<div class="bad">Не удалось получить паспорт: ${esc(e.message)}</div>`;
  }
}
loadDocs();
</script>
</body>
</html>
