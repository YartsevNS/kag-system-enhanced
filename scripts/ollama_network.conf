[Service]
# Ollama должен принимать запросы из внутренней сети: api и worker живут на другом сервере (18),
# и распознавание таблиц моделью зрения идёт по HTTP. Без этого Ollama слушает только localhost,
# и проверка связи из api отвечает «Connection refused» (проверено 27.09.2026).
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Держим модель в памяти дольше: распознавание страницы на CPU занимает десятки секунд, и повторная
# загрузка модели при каждом вызове съедала бы время.
Environment="OLLAMA_KEEP_ALIVE=30m"
