[pytest]
# Тесты ищем только в tests/.
# Без этого запуск «просто pytest» с корня проекта падает на СБОРЕ: pytest тянет
# reports/_scratch/*.py (диагностические скрипты сессий) и src/test_upload_flow.py
# (скрипт, не тест) — три ошибки коллекции, полный прогон не стартует.
# Проверено: так запускается весь набор (595 тестов), командой «pytest» без аргументов.
testpaths = tests
