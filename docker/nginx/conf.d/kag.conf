# Проксирование к KAG API
upstream kag_api {
    server api:8000;
    keepalive 32;
}

# Проксирование к MCP серверу
upstream kag_mcp {
    server mcp-server:8001;
    keepalive 16;
}

# Проксирование к Keycloak (SSO)
upstream kag_keycloak {
    server keycloak:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    # ── API: НИКОГДА не кэшировать ─────────────────────────────────────
    # Многопользовательность: ответы /api/ фильтруются по правам
    # пользователя (group_ids, is_admin). Общий/приватный кэш может отдать
    # данные одного пользователя другому. no-store — жёсткий запрет.
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;

        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── Миниатюры: кэшировать ──────────────────────────────────────────
    # Без этого location nginx ставил no-store на все /api/ → браузер тянул
    # миниатюры каждый раз. Здесь НЕ добавляем свой Cache-Control: FastAPI
    # сам отдаёт правильные заголовки (реальная миниатюра: max-age=86400,
    # заглушка: no-cache). Если добавить add_header — nginx перекроет no-cache
    # заглушки на max-age и браузер закэширует пустую картинку на день.
    location ~ ^/api/v1/upload/[0-9a-f-]+/thumbnail$ {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ── Keycloak (SSO): через nginx, не напрямую ───────────────────────
    # Внешние пользователи ходят на /realms/* — это Keycloak за nginx.
    # Позволяет Keycloak работать в prod mode с KC_HOSTNAME=<внешний адрес>
    # и KC_PROXY=edge (HTTPS снаружи, HTTP внутри).
    location ~ ^/(realms|admin/realms|resources)/ {
        proxy_pass http://kag_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # Upload endpoints (большое тело, отдельный rate limit)
    location /api/v1/upload {
        limit_req zone=upload_limit burst=10 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        client_max_body_size 500M;

        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
    }

    # MCP endpoint (SSE — не буферизовать, не кэшировать)
    location /mcp/ {
        limit_req zone=api_limit burst=30 nodelay;
        add_header Cache-Control "no-store" always;

        proxy_pass http://kag_mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Документация API
    location /docs {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
    }

    # ── Статика: кэшировать агрессивно ─────────────────────────────────
    # /static/ — общие ресурсы (CSS/JS/картинки), не персональные данные.
    # max-age=1ч + ETag от StaticFiles (FastAPI): браузер держит копию,
    # при изменении файла ETag меняется → перекачивается только новое.
    location /static/ {
        # Кэш статики: 1 час. ETag от StaticFiles (FastAPI) — при изменении
        # файла браузер перекачает только новое. Только public-ресурсы —
        # персональные данные здесь не отдаются.
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
    }

    # ── Страницы (HTML): проксировать, кэш контролирует FastAPI ────────
    # FastAPI отдаёт Cache-Control: no-cache, no-store для HTML (свежесть
    # после деплоя). Здесь не переопределяем.
    location / {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Блокировка доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS сервер (самоподписанный сертификат, генерируется deploy.sh)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/kag.crt;
    ssl_certificate_key /etc/nginx/ssl/kag.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Те же location блоки, что и в HTTP-сервере
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Миниатюры: кэшировать (см. комментарий в HTTP-сервере — без add_header)
    location ~ ^/api/v1/upload/[0-9a-f-]+/thumbnail$ {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Keycloak (SSO) через nginx — см. комментарий в HTTP-сервере
    location ~ ^/(realms|admin/realms|resources)/ {
        proxy_pass http://kag_keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    location /api/v1/upload {
        limit_req zone=upload_limit burst=10 nodelay;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        client_max_body_size 500M;
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 600s;
    }

    location /mcp/ {
        limit_req zone=api_limit burst=30 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://kag_mcp;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    location /static/ {
        # Кэш статики: 1 час. ETag от StaticFiles (FastAPI) — при изменении
        # файла браузер перекачает только новое. Только public-ресурсы —
        # персональные данные здесь не отдаются.
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://kag_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
